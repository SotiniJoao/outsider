[project]
name = "outsider"
version = "0.2.0"
description = "A blind, adversarial reviewer for your branch: a model that never saw the ticket tries to break the diff."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "João Luiz Sotini" }]
requires-python = ">=3.11"
dependencies = ["litellm>=1.80", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
outsider = "outsider.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outsider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
